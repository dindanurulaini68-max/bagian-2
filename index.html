<!DOCTYPE html>
<html lang="id">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ensiklopedia Sisingaan Bagian 2</title>
  
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const sceneEl = document.querySelector('a-scene');

      // 1. Ambil target entity masing-masing halaman
      const target0 = document.querySelector('#target0');
      const target1 = document.querySelector('#target1');
      const target2 = document.querySelector('#target2');
      const target3 = document.querySelector('#target3');
      const target4 = document.querySelector('#target4');
      const target5 = document.querySelector('#target5');

      // 2. Ambil audio & video masing-masing halaman
      const video5 = document.querySelector('#videoModel5');
      const audio6 = document.querySelector('#audio_halaman6');
      const video6 = document.querySelector('#videoModel6');
      const audio7 = document.querySelector('#audio_halaman7');
      const video8 = document.querySelector('#videoModel8');
      const audio9A = document.querySelector('#audio_halaman9A');
      const audio9B = document.querySelector('#audio_halaman9B');

      // Unmute & Unlock Audio/Video secara otomatis pada sentuhan/klik pertama di layar
      const unlockMediaOnFirstTouch = () => {
        // Unlock Audio
        [audio6, audio7, audio9A, audio9B].forEach(audio => {
          if (audio) {
            audio.play().then(() => {
              audio.pause();
              audio.currentTime = 0;
            }).catch(() => {});
          }
        });

        // Unlock Video 
        [video5, video6, video8].forEach(video => {
          if (video) {
            video.muted = false;
            video.play().then(() => {
              video.pause();
              video.currentTime = 0;
            }).catch(() => {});
          }
        });

        window.removeEventListener('touchstart', unlockMediaOnFirstTouch);
        window.removeEventListener('click', unlockMediaOnFirstTouch);
      };

      window.addEventListener('touchstart', unlockMediaOnFirstTouch, { once: true });
      window.addEventListener('click', unlockMediaOnFirstTouch, { once: true });

      // Helper Listener Audio
      function setupAudioTarget(targetEl, audioEl) {
        if (!targetEl || !audioEl) return;

        targetEl.addEventListener("targetFound", () => {
          audioEl.play().catch(e => console.log("Autoplay audio terhalang: ", e));
        });

        targetEl.addEventListener("targetLost", () => {
          audioEl.pause();
          audioEl.currentTime = 0;
        });
      }

      // Helper Listener Video
      function setupVideoTarget(targetEl, videoEl) {
        if (!targetEl || !videoEl) return;

        targetEl.addEventListener("targetFound", () => {
          videoEl.play().catch(e => {
            console.log("Autoplay video terhalang, mencoba memutar tanpa suara...", e);
            videoEl.muted = true; // Fallback jika browser tetap memblokir audio video
            videoEl.play();
          });
        });

        targetEl.addEventListener("targetLost", () => {
          videoEl.pause();
          videoEl.currentTime = 0;
        });
      }

      // Pasang Listener Audio
      setupAudioTarget(target1, audio6);
      setupAudioTarget(target2, audio7);
      setupAudioTarget(target4, audio9A);
      setupAudioTarget(target5, audio9B);

      // Pasang Listener Video
      setupVideoTarget(target0, video5);
      setupVideoTarget(target1, video6);
      setupVideoTarget(target3, video8);

    });
  </script>
</head>
<body style="margin: 0; overflow: hidden;">

<a-scene 
    gltf-model="dracoDecoderPath: https://www.gstatic.com/draco/v1/decoders/;"
    mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.0001; filterBeta: 0.001; missTolerance: 12;" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">

  <a-assets>
    <!-- Target 0: Halaman 5 -->
    <video id="videoModel5" src="./halaman 5/video halaman 5 ringan.mp4" loop playsinline crossorigin="anonymous"></video>

    <!-- Target 1: Halaman 6 -->
    <a-asset-item id="hoflandModel6" src="./halaman 6/hofland berdiri ringan.glb"></a-asset-item>
    <audio id="audio_halaman6" src="./halaman 6/halaman6 audio ringan.mp3" preload="auto"></audio>
    <video id="videoModel6" src="./halaman 6/video hofland ringan.mp4" loop playsinline crossorigin="anonymous"></video>

    <!-- Target 2: Halaman 7 -->
    <a-asset-item id="hoflanModel7" src="./halaman 7/compressed-hoflan sisingaan.glb"></a-asset-item>
    <a-asset-item id="patungModel7" src="./halaman 7/compressed-patung_singa.glb"></a-asset-item>
    <a-asset-item id="pemikulModel7" src="./halaman 7/compressed-pemikul halaman 4.glb"></a-asset-item>
    <audio id="audio_halaman7" src="./halaman 7/halaman7 audio.mp3" preload="auto"></audio>

    <!-- Target 3: Halaman 8 -->
    <video id="videoModel8" src="./halaman 8/video halaman 8 ringan.mp4" loop playsinline crossorigin="anonymous"></video>

    <!-- Target 4: Halaman 9A -->
    <a-asset-item id="bahukatModel9A" src="./halaman 9A/compressed-bah ukat.glb"></a-asset-item>
    <audio id="audio_halaman9A" src="./halaman 9A/halaman9A audio.mp3" preload="auto"></audio>

    <!-- Target 5: Halaman 9B -->
    <a-asset-item id="bahnanuModel9B" src="./halaman 9B/compressed-bah nanu.glb"></a-asset-item>
    <audio id="audio_halaman9B" src="./halaman 9B/halaman9B audio.mp3" preload="auto"></audio>

  </a-assets>

  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <!-- TARGET 0 (Halaman 5) -->
  <a-entity id="target0" mindar-image-target="targetIndex: 0">
    <a-plane src="#videoModel5" position="0 0 0" rotation="0 0 0" width="1" height="1.5" material="shader: flat"></a-plane>
  </a-entity>

  <!-- TARGET 1 (Halaman 6) -->
  <a-entity id="target1" mindar-image-target="targetIndex: 1">
    <a-gltf-model src="#hoflandModel6" position="0.3 0 0" scale="0.5 0.5 0.5" rotation="90 0 0" animation-mixer animation></a-gltf-model>
    <a-plane src="#videoModel6" position="-0.4 0 0" rotation="0 0 0" width="1" height="1" material="shader: flat"></a-plane>
  </a-entity>

  <!-- TARGET 2 (Halaman 7) -->
  <a-entity id="target2" mindar-image-target="targetIndex: 2">
    <a-gltf-model src="#hoflanModel7" position="-0.07 0 0.45" scale="0.2 0.2 0.2" rotation="90 0 0" animation-mixer animation></a-gltf-model>
    <a-gltf-model src="#patungModel7" position="-0.07 -0.05 0.51" scale="0.2 0.2 0.2" rotation="90 0 0" animation-mixer animation></a-gltf-model>
    <a-gltf-model src="#pemikulModel7" position="-0.18 -0.2 0" scale="0.3 0.3 0.3" rotation="90 0 0" animation-mixer animation></a-gltf-model>
    <a-gltf-model src="#pemikulModel7" position="0.07 -0.2 0" scale="0.3 0.3 0.3" rotation="90 0 0" animation-mixer animation></a-gltf-model>
    <a-gltf-model src="#pemikulModel7" position="-0.18 0.12 0" scale="0.3 0.3 0.3" rotation="90 0 0" animation-mixer animation></a-gltf-model>
    <a-gltf-model src="#pemikulModel7" position="0.07 0.12 0" scale="0.3 0.3 0.3" rotation="90 0 0" animation-mixer animation></a-gltf-model>
  </a-entity>

  <!-- TARGET 3 (Halaman 8) -->
  <a-entity id="target3" mindar-image-target="targetIndex: 3">
    <a-plane src="#videoModel8" position="0 0 0" rotation="0 0 0" width="1" height="1.5" material="shader: flat"></a-plane>
  </a-entity>

  <!-- TARGET 4 (Halaman 9A) -->
  <a-entity id="target4" mindar-image-target="targetIndex: 4">
    <a-gltf-model src="#bahukatModel9A" position="0 0 0.3" scale="0.8 0.8 0.8" rotation="90 0 0" animation-mixer animation></a-gltf-model>
  </a-entity>

  <!-- TARGET 5 (Halaman 9B) -->
  <a-entity id="target5" mindar-image-target="targetIndex: 5">
    <a-gltf-model src="#bahnanuModel9B" position="0 0 0.1" scale="0.65 0.65 0.65" rotation="90 0 0" animation-mixer animation></a-gltf-model>
  </a-entity>

</a-scene>

</body>
</html>
